<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение для Настеньки ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@400;600;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #2b080c 0%, #5c0612 50%, #800c1c 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .screen {
            text-align: center;
            background: rgba(43, 8, 12, 0.6);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 90%;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #mainContainer {
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background-color: #d91b43;
            color: white;
        }

        .btn:hover {
            background-color: #ff2a55;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(217, 27, 67, 0.4);
        }

        .btn-no {
            position: relative;
            z-index: 20;
        }

        .btn-no.running {
            position: absolute;
            transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1), top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .legs-container {
            position: absolute;
            bottom: -24px;
            left: 0;
            width: 100%;
            height: 25px;
            display: none;
            justify-content: space-around;
            pointer-events: none;
        }

        .leg {
            width: 8px;
            height: 22px;
            background-color: #d91b43;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            transform-origin: top center;
        }

        @keyframes run-left {
            0%, 100% { transform: rotate(-25deg); }
            50% { transform: rotate(35deg); }
        }
        @keyframes run-right {
            0%, 100% { transform: rotate(35deg); }
            50% { transform: rotate(-25deg); }
        }

        .btn-no.running .legs-container { display: flex; }
        .btn-no.running .leg:nth-child(1) { animation: run-left 0.12s infinite linear; }
        .btn-no.running .leg:nth-child(2) { animation: run-right 0.12s infinite linear; }

        .speech-bubble {
            position: absolute;
            background: #ffffff;
            color: #2b080c;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 180px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 30;
            display: none;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
        }

        .speech-bubble.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* Экран 2: УРААА */
        .success-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 6rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 42, 85, 0.6), 0 10px 30px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite alternate;
            z-index: 6;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .kiss-emoji {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 7;
            animation: flyUp 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* Экран 3: Сетка шифров */
        #placesContainer {
            display: none;
            opacity: 0;
            max-width: 850px;
            padding: 40px;
        }

        #placesContainer h2 {
            margin-bottom: 30px;
        }

        .places-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .place-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 4 / 5;
        }

        .place-card:hover {
            background: rgba(217, 27, 67, 0.2);
            border-color: #ff2a55;
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(217, 27, 67, 0.4);
        }

        .place-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .places-grid { grid-template-columns: 1fr; gap: 15px; }
            .place-card { aspect-ratio: 4 / 3; }
            h1, #placesContainer h2 { font-size: 2.3rem; }
            .success-title { font-size: 3.5rem; }
            .screen { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="screen" id="mainContainer">
        <h1>Кицюня, пойдем на свидание?)</h1>
        <div class="buttons-container" id="btnContainer">
            <button class="btn btn-yes" id="btnYes">Да</button>
            <button class="btn btn-no" id="btnNo">
                Нет
                <div class="legs-container">
                    <div class="leg"></div>
                    <div class="leg"></div>
                </div>
            </button>
            <div class="speech-bubble" id="bubble">ну погнали, чего ты)</div>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        
		<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVNSsN4qakZBXNvBOLEU3n9s3QQLxydF_SlE37o5JPKXssNsa5YF2fdBr7&s=10" class="place-image" alt="Code 1">
    </div>

    <div class="screen" id="placesContainer">
        <h2>Куда хочешь пойти?</h2>
        <div class="places-grid">
            
            <div class="place-card" data-place="Ресторан">
                <img src="https://love-event.com.ua/wp-content/uploads/%D1%81%D0%B2%D0%B8%D0%B4%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BD%D0%B0-%D0%BC%D0%B0%D1%8F%D0%BA%D0%B5-54-768x1024.jpg?v=1575913982" class="place-image" alt="Code 1">
            </div>

            <div class="place-card" data-place="Море">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZMDAPsQXh-VHNZxJnRA4SCwfo-ZM6gqpAu3EvetZ4SvkgLP9y9zkvEgE&s=10" class="place-image" alt="Code 2">
            </div>

            <div class="place-card" data-place="Бильярд">
                <img src="https://i.pinimg.com/236x/3a/7b/34/3a7b3423b49031ac9cc1d1386eca3c6a.jpg" class="place-image" alt="Code 3">
            </div>

        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const mainContainer = document.getElementById('mainContainer');
        const successScreen = document.getElementById('successScreen');
        const placesContainer = document.getElementById('placesContainer');
        const bubble = document.getElementById('bubble');

        let isFirstClick = true;

        btnNo.addEventListener('click', () => {
            if (isFirstClick) {
                btnNo.classList.add('running');
                document.body.appendChild(btnNo);
                document.body.appendChild(bubble);
                isFirstClick = false;
            }

            bubble.classList.remove('show');

            const padding = 80;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            setTimeout(() => {
                const legs = btnNo.querySelector('.legs-container');
                legs.style.display = 'none';

                bubble.classList.add('show');
                bubble.style.left = (randomX - 20) + 'px';
                bubble.style.top = (randomY - 55) + 'px';

                setTimeout(() => {
                    legs.style.display = '';
                }, 50);

            }, 600);
        });

        btnYes.addEventListener('click', () => {
            if(document.body.contains(btnNo)) btnNo.remove();
            if(document.body.contains(bubble)) bubble.remove();
            
            mainContainer.style.opacity = '0';
            setTimeout(() => {
                mainContainer.style.display = 'none';
                successScreen.style.opacity = '1';
                
                const kissInterval = setInterval(createKiss, 70);

                setTimeout(() => {
                    clearInterval(kissInterval);
                    successScreen.style.opacity = '0';
                    
                    setTimeout(() => {
                        successScreen.style.display = 'none';
                        placesContainer.style.display = 'block';
                        setTimeout(() => {
                            placesContainer.style.opacity = '1';
                        }, 50);
                    }, 500);
                    
                }, 3000);

            }, 500);
        });

        function createKiss() {
            const kiss = document.createElement('div');
            kiss.classList.add('kiss-emoji');
            kiss.innerText = '💋';
            kiss.style.left = Math.random() * 100 + 'vw';
            kiss.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            document.body.appendChild(kiss);

            setTimeout(() => { kiss.remove(); }, 2500);
        }

        // Клик по шифру
		// Перенаправление в Telegram-бот с параметром места
		document.querySelectorAll('.place-card').forEach(card => {
			card.addEventListener('click', () => {
				const selectedPlace = card.getAttribute('data-place');
				
				// Показываем сообщение
				alert(`Выбрано секретное место: ${selectedPlace}! 🎯`);
				
				// Мапим названия на латинские параметры для ссылки
				let param = 'coffee';
				if (selectedPlace === 'Бузина') param = 'elderberry';
				if (selectedPlace === 'Бильярд') param = 'billiards';

				// Плавный переход в бот через секунду после алерта
				setTimeout(() => {
					window.location.href = `https://t.me/for_NastiaBot`;
				}, 1000);
			});
		});
    </script>
</body>
</html>
